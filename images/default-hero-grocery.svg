<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="ベトナムフーディーのイメージイラスト(食材店)">
  <!-- 写真がないときに、詳細ページで使う、横長のイラスト(実際の店舗の写真ではありません。正方形の default-grocery.svg と同じ絵) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f2fd" />
      <stop offset="1" stop-color="#bbdefb" />
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg)" />
  <g transform="translate(120 15)">
  <circle cx="120" cy="132" r="92" fill="#ffffff" opacity="0.55" />

  <!-- 黄色い星(ベトナム国旗をイメージ) -->
  <polygon points="200,34 204.7,48.3 219.7,48.3 207.5,57.1 212.2,71.4 200,62.6 187.8,71.4 192.5,57.1 180.3,48.3 195.3,48.3" fill="#ffca28" />

  <!-- かごの中の食材(ハーブ・唐辛子・麺の袋・フランスパン) -->
  <path d="M74 120 q-6 -30 14 -46 q4 22 -2 46 z" fill="#66bb6a" />
  <path d="M86 120 q4 -34 26 -44 q-2 24 -12 44 z" fill="#43a047" />
  <rect x="112" y="78" width="30" height="44" rx="4" fill="#fff8e1" stroke="#ffb300" stroke-width="3" />
  <path d="M118 92 h18 M118 100 h18 M118 108 h18" stroke="#ffb300" stroke-width="3" stroke-linecap="round" />
  <path d="M146 120 q2 -36 30 -50 q8 6 2 12 q-20 14 -20 38 z" fill="#e53935" />
  <rect x="150" y="66" width="10" height="8" rx="2" fill="#2e7d32" transform="rotate(-30 155 70)" />

  <!-- かご -->
  <path d="M52 118 h136 l-14 80 a8 8 0 0 1 -8 7 h-92 a8 8 0 0 1 -8 -7 z" fill="#1e63d6" />
  <path d="M60 140 h120 M64 164 h112 M68 186 h104" stroke="#ffffff" stroke-width="4" opacity="0.35" />
  <path d="M86 122 v78 M120 122 v80 M154 122 v78" stroke="#ffffff" stroke-width="4" opacity="0.35" />
  <rect x="46" y="112" width="148" height="12" rx="6" fill="#1550b0" />
  <!-- 持ち手 -->
  <path d="M74 112 q46 -64 92 0" fill="none" stroke="#1550b0" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
