<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 240" role="img" aria-label="ベトナムフーディー">
  <!-- 店舗の写真がないとき・読み込み中に出す画像: ベトナムフーディーのロゴ(トップと同じロゴ。実際の店舗の写真ではありません) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8f1" />
      <stop offset="1" stop-color="#e3efe0" />
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)" />
  <image x="60.8" y="42.0" width="118.5" height="156.0" href="data:image/png;base64," xlink:href="data:image/png;base64," />
</svg>
