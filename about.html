<!-- 「/about」を直接開いたとき・再読み込みしたときの入口。
     サイト本体(index.html)の「?page=about」に移り、表示上のURLは js/detail.js が「/about」に戻す -->

  location.replace(location.pathname.replace(/about(\.html)?\/?$/i, "") + "?page=about" + location.hash);
</script>
