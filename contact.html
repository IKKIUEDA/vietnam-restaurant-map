<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ | ベトナムフーディー</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://vietnamfoodie.compass-story.net/contact">
<!-- 「/contact」を直接開いたとき・再読み込みしたときの入口。
     サイト本体(index.html)の「?view=contact」に移り、表示上のURLは js/contact.js が「/contact」に戻す -->
<script>
  location.replace(location.pathname.replace(/contact(\.html)?\/?$/i, "") + "?view=contact" + location.hash);
</script>
</head>
<body>
<p><a href="/?view=contact">お問い合わせ</a></p>
</body>
</html>
