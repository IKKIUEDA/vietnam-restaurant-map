<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プライバシーポリシー | ベトナムフーディー</title>
<link rel="canonical" href="https://vietnamfoodie.compass-story.net/privacy">
<!-- 「/privacy」を直接開いたとき・再読み込みしたときの入口。
     サイト本体(index.html)の「?page=privacy」に移り、表示上のURLは js/detail.js が「/privacy」に戻す -->
<script>
  location.replace(location.pathname.replace(/privacy(\.html)?\/?$/i, "") + "?page=privacy" + location.hash);
</script>
</head>
<body>
<p><a href="/?page=privacy">プライバシーポリシー</a></p>
</body>
</html>
